# =============================================================
# application.properties
# Configuración general de la aplicación Spring Boot.
#
# La aplicación NO requiere base de datos en esta primera versión,
# por lo que no se configura ningún DataSource.
# =============================================================

# Nombre visible de la aplicación (aparece en logs de arranque)
spring.application.name=Plataforma Educativa - Estructuras y Organizacion de Datos

# Puerto en el que se levanta el servidor embebido Tomcat.
# La aplicacion quedara disponible en http://localhost:8080/
server.port=8080

# Desactiva el cache de plantillas Thymeleaf durante el desarrollo,
# para que los cambios en los .html se reflejen sin reiniciar el servidor.
# BACKEND TODO: cambiar a "true" antes de desplegar en produccion.
spring.thymeleaf.cache=false

# Codificacion de las plantillas para evitar problemas con tildes y enie.
spring.thymeleaf.encoding=UTF-8
